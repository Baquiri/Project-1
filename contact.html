<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1026" />
    <title>Contact Us</title>
    <style>
      :root { color-scheme: dark; --ink:#f7f7ff; --muted:#b9b9d2; --panel:rgba(20,25,62,.68); --accent:#9eeaf9; } * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; padding:6.5rem 1.25rem 2rem; display:grid; place-items:center; overflow-x:hidden; font-family:Inter,ui-sans-serif,system-ui,sans-serif; color:var(--ink); background:#0b1026; } .orb { position:fixed; z-index:-1; width:38vmax; aspect-ratio:1; border-radius:50%; opacity:.56; filter:blur(32px); animation:drift 14s ease-in-out infinite alternate; } .one { top:-17vmax; right:-9vmax; background:#ec4899; } .two { left:-14vmax; bottom:-17vmax; background:#06b6d4; animation-delay:-5s; }
      nav { position:fixed; z-index:2; top:1.4rem; display:flex; gap:.35rem; padding:.4rem; border:1px solid rgba(255,255,255,.12); border-radius:999px; background:rgba(13,17,45,.62); backdrop-filter:blur(14px); } nav a { padding:.55rem .95rem; border-radius:999px; color:var(--muted); font-size:.88rem; font-weight:700; text-decoration:none; transition:.16s ease; } nav a:hover, nav a[aria-current="page"] { color:#fff; background:rgba(255,255,255,.13); }
      main { width:min(100%,850px); padding:clamp(2rem,5vw,4.5rem); border:1px solid rgba(255,255,255,.16); border-radius:30px; background:var(--panel); box-shadow:0 30px 80px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.12); backdrop-filter:blur(18px); animation:arrive .8s cubic-bezier(.2,.8,.2,1) both; } .eyebrow { margin:0 0 1rem; color:var(--accent); font-size:.78rem; font-weight:800; letter-spacing:.18em; text-transform:uppercase; } h1 { margin:0; font-size:clamp(3rem,8vw,5.4rem); line-height:.98; letter-spacing:-.065em; background:linear-gradient(110deg,#fff 10%,#b5f5ff 45%,#f4b8ff 88%); -webkit-background-clip:text; background-clip:text; color:transparent; } .intro { max-width:54ch; color:var(--muted); line-height:1.7; }
      form { display:grid; gap:1rem; margin-top:2rem; } .row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; } label { display:grid; gap:.45rem; color:#e8e8f6; font-size:.87rem; font-weight:700; } input, textarea { width:100%; padding:.85rem 1rem; border:1px solid rgba(255,255,255,.14); border-radius:12px; outline:0; color:var(--ink); font:inherit; background:rgba(7,10,31,.38); } input:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(158,234,249,.12); } textarea { min-height:130px; resize:vertical; } button { justify-self:start; padding:.85rem 1.25rem; border:0; border-radius:999px; color:#07111e; font:inherit; font-weight:800; cursor:pointer; background:linear-gradient(100deg,#9eeaf9,#d5b9ff); box-shadow:0 10px 25px rgba(110,218,242,.18); } button:hover { filter:brightness(1.08); }
      @keyframes drift { to { transform:translate(7vmax,5vmax) scale(1.16); } } @keyframes arrive { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:none; } } @media (max-width:600px) { .row { grid-template-columns:1fr; } } @media (prefers-reduced-motion:reduce) { * { animation-duration:.01ms !important; animation-iteration-count:1 !important; } }
    </style>
  </head>
  <body>
    <div class="orb one"></div><div class="orb two"></div>
    <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About Us</a><a href="contact.html" aria-current="page">Contact</a></nav>
    <main>
      <p class="eyebrow">Say hello</p>
      <h1>Let's connect.</h1>
      <p class="intro">Have an idea, a question, or simply want to share a good thought? Send us a note — we'd love to hear from you.</p>
      <form onsubmit="event.preventDefault(); this.querySelector('button').textContent = 'Message sent — thank you!'; this.querySelector('button').disabled = true;">
        <div class="row"><label>Name<input name="name" autocomplete="name" placeholder="Your name" required /></label><label>Email<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required /></label></div>
        <label>Message<textarea name="message" placeholder="What would you like to talk about?" required></textarea></label>
        <button type="submit">Send message</button>
      </form>
    </main>
  </body>
</html>
