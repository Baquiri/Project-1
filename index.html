                                              <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1026" />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f7f7ff;
        --muted: #b9b9d2;
        --panel: rgba(20, 25, 62, 0.62);
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: #0b1026;
      }

      .orb {
        position: fixed;
        width: 38vmax;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(28px);
        opacity: 0.6;
        animation: drift 14s ease-in-out infinite alternate;
      }

      .orb.one { top: -18vmax; left: -10vmax; background: #7c3aed; }
      .orb.two { right: -14vmax; bottom: -18vmax; background: #06b6d4; animation-delay: -5s; }
      .orb.three { top: 30%; left: 44%; width: 21vmax; background: #ec4899; animation-delay: -9s; }

      main {
        position: relative;
        width: min(90vw, 760px);
        padding: clamp(2rem, 7vw, 5.5rem);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 30px;
        background: var(--panel);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.38), inset 0 1px rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(18px);
        animation: arrive 900ms cubic-bezier(.2,.8,.2,1) both;
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #9eeaf9;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3.4rem, 12vw, 7.7rem);
        line-height: 0.94;
        letter-spacing: -0.075em;
        background: linear-gradient(110deg, #fff 10%, #b5f5ff 45%, #f4b8ff 88%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p:not(.eyebrow) {
        max-width: 41ch;
        margin: 1.55rem auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.16rem);
        line-height: 1.65;
      }

      .sparkles { margin-top: 2.2rem; font-size: 1.55rem; letter-spacing: 0.38em; }

      @keyframes drift {
        to { transform: translate(8vmax, 6vmax) scale(1.18); }
      }

      @keyframes arrive {
        from { opacity: 0; transform: translateY(24px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
    <main>
      <p class="eyebrow">A tiny beginning</p>
      <h1>Hello,<br />World!</h1>
      <p>One simple page, a little bit of magic, and a whole universe of possibilities ahead.</p>
      <div class="sparkles" aria-label="sparkles">✦ ✧ ✦</div>
    </main>
  </body>
</html>
